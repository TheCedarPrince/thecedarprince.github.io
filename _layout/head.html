<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> {{insert meta.html}} {{if hasmath}} {{insert head_katex.html }} {{end}} {{if
    hascode}} {{insert head_highlight.html }} {{end}}
    <link rel="stylesheet" href="/css/franklin.css">
    <link rel="stylesheet" href="/css/basic.css">
    <link rel="stylesheet" href="/css/action.css">
    <link rel="icon" href="/assets/favicon.ico"> {{isdef title}}
    <title>{{fill title}}</title> {{end}}

    <!--SUPPORT FOR DARKMODE-JS-->
    <script src="/libs/darkmode/darkmode-js.min.js"></script>
    <script>
        function addDarkmodeWidget()
        {
            const options = {
                bottom: '32px', /* default: '32px' */
                right: '32px', /* default: '32px' */
                left: 'unset', /* default: 'unset' */
                time: '.0s', /* default: '0.3s' */
                mixColor: '#fff', /* default: '#fff' */
                backgroundColor: '#fff', /* default: '#fff' */
                buttonColorDark: '#100f2c', /* default: '#100f2c' */
                buttonColorLight: '#fff', /* default: '#fff' */
                saveInCookies: true, /* default: true, */
                label: '🌓', /* default: '' */
                autoMatchOsTheme: true /* default: true */
            };
            new Darkmode(options).showWidget();
        };
        window.addEventListener('DOMContentLoaded', addDarkmodeWidget);
    </script>

    <!--SUPPORT FOR ANALYTICS FROM GOATCOUNTER-->
    <script data-goatcounter="https://thecedarledge.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <link href="/pagefind/pagefind-component-ui.css" rel="stylesheet">
    <script src="/pagefind/pagefind-component-ui.js" type="module"></script>

    <div class="action" data-pagefind-ignore>
      <button></button>
      <ul>
        <li><a href="#">Top of Page</a></li>
        <li><a href="#discussion">Discussion</a></li> 
        <hr>
        <li><a href="/blog">Blog</a></li>
        <li><a href="/notes">Notes</a></li>
        <li><a href="/projects">Projects</a></li>
        <li><a href="/ideas">Ideas</a></li>
      </ul>
    </div>

    <script src="/libs/action.js"></script>

</head>


<body data-pagefind-body>
    <div data-pagefind-ignore>
        {{insert header.html}} {{addsearchbar}}
    </div>
